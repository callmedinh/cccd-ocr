[project]
name = "cccd-ocr"
version = "1.0.0"
description = "Quét ảnh Căn cước công dân Việt Nam và xuất ra Excel/CSV"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cho phép chữ tiếng Việt trong comment/docstring

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
