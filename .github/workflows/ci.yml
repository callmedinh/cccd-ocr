name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Cài Tesseract + bộ dữ liệu tiếng Việt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-vie libgl1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          # bản headless để không cần libGL/GUI trên runner
          pip install opencv-python-headless numpy pillow openpyxl ruff

      - name: Tải bộ dữ liệu tiếng Việt (tessdata_best, giống bản phát hành)
        run: python tools/get_models.py

      - name: Kiểm tra mã nguồn
        run: python -m ruff check .

      - name: Chạy kiểm thử
        run: python -m unittest discover -s tests -v

      - name: Thử chạy dòng lệnh trên ảnh mẫu
        run: python main.py samples/ -o output/cccd.xlsx --csv
